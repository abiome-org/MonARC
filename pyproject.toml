[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monarc"
version = "0.1.0"
description = "Map-conditioned GPS-denied visual localization via emergent metric landmarks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "abiome-org"}]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "scipy>=1.11",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ingest = ["rasterio>=1.3"]

[project.scripts]
monarc = "monarc.cli:main"

[tool.setuptools.packages.find]
include = ["monarc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
